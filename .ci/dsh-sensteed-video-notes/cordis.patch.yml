# Register the video-processing MCP and the video-notes skill for Sensteed Agent.
#
# 凭据约束（docs/1010/03 §1）：Models key 只来自 Host 环境的 MODELS_API_KEY，
# 不写死任何 key；patch / skill / 脚本参数中不出现凭证字面量。
- insert:
    - id: mcp-video-processing
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: video-processing
        url: 'https://ai.hozonauto.com/mcp/tools/video-processing'
        headers:
          Authorization: !!js ('Bearer ' + (process.env.MODELS_API_KEY || ''))
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true

    - id: sensteed-video-notes
      name: '@dofe/dsh-sensteed-video-notes'
