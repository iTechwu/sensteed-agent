# Register the supply-chain MCP and supplier-intelligence guidance for Sensteed Agent.
- insert:
    - id: mcp-supply-chain
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: supply-chain
        url: 'https://ai.hozonauto.com/mcp/tools/supply-chain'
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true

    - id: sensteed-supplier-intelligence
      name: '@dofe/dsh-sensteed-supplier-intelligence'
