# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    # Sensteed 数据源插件；bundle 自带 MCP 与 guidance。
    - id: dofe-sensteed-finance
      name: '@dofe/dsh-sensteed-finance'
    - id: dofe-sensteed-supplier-intelligence
      name: '@dofe/dsh-sensteed-supplier-intelligence'
    # dsh-soup：项目资源管理器（独立插件）。宿主半区注册 /api/dsh-soup
    # 文件操作路由；浏览器半区注册 details 右列面板与 Session log 📁 切换。
    - id: ui-dsh-soup
      name: '@lyhue1991/dsh-soup'
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: desktop-browser-tools
      name: dsh-plugin-desktop/browser-tools
    - id: dofe-managed
      name: dsh-plugin-desktop/dofe-managed
    - id: personal-knowledge-files
      name: dsh-plugin-desktop/personal-knowledge-files
    - id: personal-knowledge-management
      name: '@dofe/dsh-sensteed-knowledge'
    # dofe-managed owns the OpenMontage MCP transport. This shared Host module
    # adds workflow guidance, Agent-scoped projection, and stalled-call blocking.
    - id: openmontage-guidance
      name: '@dofe/dsh-openmontage-mcp'
      config:
        stalledOutcomeThreshold: 3
    - id: dofe-opencli
      name: dsh-plugin-desktop/dofe-opencli

# DoFe owns the model route in the Desktop distribution. The upstream adapter
# remains in place, but Desktop fixes its single managed key and endpoint.
- id: llm-deepseek
  config:
    apiKeyEnv: MODELS_API_KEY
    baseURL: https://ai.hozonauto.com/api/v1
    connectionPolicy: composition
    retryPolicy:
      mode: normal
      maxRetries: 2
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, STREAM_CLOSED]
      backoff:
        initialDelayMs: 1000
        maxDelayMs: 10000
        jitterRatio: 0.1
    models:
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        description: DoFe managed DeepSeek model
        contextWindow: 1000000
        inputModalities: [text, image]

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# The DoFe Access page is the only model configuration surface in Desktop.
# Users can still manage the key, but cannot select another provider, endpoint,
# or catalog through the upstream Models editor.
- id: ui-settings-models
  disabled: true

# Desktop supplies the Yootun occupants for the shared browser-brand slots.
- id: ui-brand-official
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# The isolated desktop Host never mounts Node's internal loader seam, so the
# module-HMR service cannot activate; profile reloads ride the settings
# document and the desktop-owned reload path instead. Overrides the
# base-bundle row in place (top-level patch statement, applied last).
- id: hmr
  disabled: true
