name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_kind:
        description: 'Candidate artifacts or a signed release that advances the TOS channel'
        type: choice
        options: [candidate, release]
        default: candidate
        required: true
      brand:
        description: 'White-label brand variant for the packaged applications'
        type: choice
        options:
          - sensteed
        default: sensteed
        required: false

permissions:
  contents: read

concurrency:
  # Include the commit so queued release candidates cannot replace one
  # another before a runner becomes available.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  # Every run produces release-validation evidence; never discard a queued or
  # active macOS/Windows build when a later commit lands on the same branch.
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Dashboard periods are local-calendar semantics; keep CI deterministic.
  TZ: Asia/Shanghai

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
      upstream_sha: ${{ steps.source.outputs.upstream_sha }}
      upstream_repository: ${{ steps.source.outputs.upstream_repository }}
      version: ${{ steps.source.outputs.version }}
      release: ${{ steps.source.outputs.release }}
      channel: ${{ steps.source.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Validate the actual PR head; all jobs share one resolved sibling commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

      - name: Test CI publication contracts
        run: |
          node --test scripts/ci/resolve-source.test.mjs
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Resolve one Harness commit for every platform
        if: steps.scope.outputs.product == 'true'
        id: source
        env:
          PUBLISH_KIND: ${{ inputs.publish_kind || 'candidate' }}
        run: node scripts/ci/resolve-source.mjs

  publish-config:
    needs: changes
    if: >-
      needs.changes.outputs.product == 'true' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official TOS SDK for preflight
        run: python -m pip install -r scripts/ci/tos-requirements.txt
      - name: Validate TOS upload and optional release signing configuration
        env:
          RELEASE: ${{ needs.changes.outputs.release }}
          TOS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          TOS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_ACCESS_KEY }}
          TOS_BUCKET: ${{ vars.TOS_BUCKET || secrets.TOS_BUCKET || 'dofe-public' }}
          TOS_REGION: ${{ vars.TOS_REGION || secrets.TOS_REGION }}
          TOS_ENDPOINT: ${{ vars.TOS_ENDPOINT || secrets.TOS_ENDPOINT }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL || secrets.TOS_PUBLIC_BASE_URL }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python -B scripts/ci/publish-tos.py --check-config --probe

  # Product gate: AA profile smoke is temporarily paused below.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      # pnpm store 缓存 miss 时 fs-ext 等原生依赖会在 install 中现场编译,
      # corepack 解包的 node-gyp 启动器缺执行位会以 Permission denied 失败
      # (与 desktop-macos 的同名步骤对齐)。
      - name: Prepare node-gyp launcher permissions
        if: needs.changes.outputs.product == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --version
          find "$HOME/.cache/node/corepack" -path '*/node-gyp/gyp/gyp_main.py' -type f -exec chmod +x {} +
      - name: Fetch sibling DeepSeek Harness checkout
        if: needs.changes.outputs.product == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          UPSTREAM_REPOSITORY: ${{ needs.changes.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          upstream_dir="$GITHUB_WORKSPACE/../deepseek-harness"
          if command -v cygpath >/dev/null 2>&1; then upstream_dir="$(cygpath -u "$upstream_dir")"; fi
          mkdir -p "$upstream_dir"
          curl --fail --location --retry 3 "https://github.com/$UPSTREAM_REPOSITORY/archive/$UPSTREAM_SHA.tar.gz" | tar -xz --strip-components=1 -C "$upstream_dir"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" -c user.name=CI -c user.email=ci@localhost commit --allow-empty --quiet -m "CI source archive"
          node -e "const fs=require('node:fs'); const u=require('./upstream.json'); if(JSON.parse(fs.readFileSync('../deepseek-harness/package.json')).version!==u.sourceVersion) throw Error('Harness sourceVersion mismatch')"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          node scripts/refresh-bundled.mjs --offline
          node scripts/build-dofe-ui.mjs
      - name: Resolve pnpm store path
        if: needs.changes.outputs.product == 'true'
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The sibling fork keeps its own frozen lockfile; pnpm cannot freeze an
      # external symlink workspace against the Desktop-only root lockfile.
      - if: needs.changes.outputs.product == 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - if: needs.changes.outputs.product == 'true'
        run: pnpm --dir ../deepseek-harness install --no-frozen-lockfile --config.minimumReleaseAge=0
      - if: needs.changes.outputs.product == 'true'
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm upstream:build
      - if: needs.changes.outputs.product == 'true'
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm check

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # node-gyp 11 cannot parse the VS 18 metadata on windows-latest yet.
      # Keep native fs-ext builds on the supported VS 2022 toolchain.
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
      # Dispatch selects the white-label variant; pushes and PRs stay sensteed.
      BRAND: ${{ inputs.brand || 'sensteed' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          UPSTREAM_REPOSITORY: ${{ needs.changes.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          upstream_dir="$GITHUB_WORKSPACE/../deepseek-harness"
          if command -v cygpath >/dev/null 2>&1; then upstream_dir="$(cygpath -u "$upstream_dir")"; fi
          mkdir -p "$upstream_dir"
          curl --fail --location --retry 3 "https://github.com/$UPSTREAM_REPOSITORY/archive/$UPSTREAM_SHA.tar.gz" | tar -xz --strip-components=1 -C "$upstream_dir"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" -c user.name=CI -c user.email=ci@localhost commit --allow-empty --quiet -m "CI source archive"
          node -e "const fs=require('node:fs'); const u=require('./upstream.json'); if(JSON.parse(fs.readFileSync('../deepseek-harness/package.json')).version!==u.sourceVersion) throw Error('Harness sourceVersion mismatch')"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          node scripts/refresh-bundled.mjs --offline
          node scripts/build-dofe-ui.mjs
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The following upstream install validates the sibling's own lockfile.
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm --dir ../deepseek-harness install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Build upstream Harness
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm upstream:build
      - name: Run Windows package gate
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm --filter dsh-plugin-desktop check:win-package
      - name: Install headless Chromium
        run: pnpm --dir ../deepseek-harness/apps/web exec playwright install chromium
      - name: Verify Windows renderer startup
        run: pnpm --filter dsh-plugin-desktop verify:renderer
      - name: Probe installed AA bridge layout
        shell: pwsh
        run: |
          node -e "
            const fs = require('node:fs')
            const path = require('node:path')
            const p = 'dsh-plugin-desktop/node_modules/@agents-anywhere/dsh-bridge-next'
            const st = fs.lstatSync(p)
            const real = fs.realpathSync(p)
            const storeRoot = path.dirname(path.dirname(real))
            console.log('isLink:', st.isSymbolicLink())
            console.log('realpath:', real)
            console.log('package.json:', fs.existsSync(p + '/package.json'))
            console.log('entries:', fs.readdirSync(p).sort().join(','))
            console.log('storeRoot:', storeRoot)
            console.log('store @dataiku/uv:', fs.existsSync(path.join(storeRoot, '@dataiku', 'uv', 'package.json')))
            console.log('app-level @dataiku:', fs.existsSync('dsh-plugin-desktop/node_modules/@dataiku/uv/package.json'))
          "
      - name: Build Windows installer
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm --filter dsh-plugin-desktop dist:win
      - name: Inspect packaged output on failure
        if: failure()
        shell: pwsh
        run: |
          $res = "dsh-plugin-desktop/dist/win-unpacked/resources"
          if (Test-Path "$res/app.asar") {
            "app.asar bytes: $((Get-Item "$res/app.asar").Length)"
          } else { "no app.asar" }
          $un = "$res/app.asar.unpacked/node_modules"
          if (Test-Path $un) {
            "unpacked node_modules files: $((Get-ChildItem $un -Recurse -File | Measure-Object).Count)"
          } else { "no unpacked node_modules" }
          $bridge = "$res/app.asar.unpacked/node_modules/@agents-anywhere/dsh-bridge-next"
          if (Test-Path "$bridge/package.json") { "bridge package.json: present physically" } else { "bridge package.json: absent physically" }
      - name: Build Windows portable archive
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm --filter dsh-plugin-desktop dist:win-portable
      - name: Preserve windows package size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-size-windows
          path: dsh-plugin-desktop/dist/**/package-size-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows applications
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            dsh-plugin-desktop/dist/*-Agent-*-Setup.exe
            dsh-plugin-desktop/dist/*-Agent-*-Portable.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Linux x64 distribution artifacts: unsigned AppImage and Debian package
  # built on a stock ubuntu runner, mirroring the Windows packaging job.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          UPSTREAM_REPOSITORY: ${{ needs.changes.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          upstream_dir="$GITHUB_WORKSPACE/../deepseek-harness"
          if command -v cygpath >/dev/null 2>&1; then upstream_dir="$(cygpath -u "$upstream_dir")"; fi
          mkdir -p "$upstream_dir"
          curl --fail --location --retry 3 "https://github.com/$UPSTREAM_REPOSITORY/archive/$UPSTREAM_SHA.tar.gz" | tar -xz --strip-components=1 -C "$upstream_dir"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" -c user.name=CI -c user.email=ci@localhost commit --allow-empty --quiet -m "CI source archive"
          node -e "const fs=require('node:fs'); const u=require('./upstream.json'); if(JSON.parse(fs.readFileSync('../deepseek-harness/package.json')).version!==u.sourceVersion) throw Error('Harness sourceVersion mismatch')"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          node scripts/refresh-bundled.mjs --offline
          node scripts/build-dofe-ui.mjs
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The following upstream install validates the sibling's own lockfile.
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm --dir ../deepseek-harness install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Build upstream Harness
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm upstream:build
      - name: Run Linux package gate
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm --filter dsh-plugin-desktop check:linux-package
      - name: Build Linux AppImage and Debian package
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm --filter dsh-plugin-desktop dist:linux
      - name: Preserve linux package size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-size-linux
          path: dsh-plugin-desktop/dist/**/package-size-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux applications
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.brand || 'sensteed' }}-agent-linux-x64
          path: |
            dsh-plugin-desktop/dist/*-Agent-Beta-*.AppImage
            dsh-plugin-desktop/dist/*-Agent-Beta-*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Stage Linux applications for publication
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            dsh-plugin-desktop/dist/*.AppImage
            dsh-plugin-desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Dispatch selects the white-label variant; pushes and PRs stay sensteed.
      BRAND: ${{ inputs.brand || 'sensteed' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Prepare node-gyp launcher permissions
        shell: bash
        run: |
          set -euo pipefail
          pnpm --version
          find "$HOME/.cache/node/corepack" -path '*/node-gyp/gyp/gyp_main.py' -type f -exec chmod +x {} +
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          UPSTREAM_REPOSITORY: ${{ needs.changes.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          upstream_dir="$GITHUB_WORKSPACE/../deepseek-harness"
          if command -v cygpath >/dev/null 2>&1; then upstream_dir="$(cygpath -u "$upstream_dir")"; fi
          mkdir -p "$upstream_dir"
          curl --fail --location --retry 3 "https://github.com/$UPSTREAM_REPOSITORY/archive/$UPSTREAM_SHA.tar.gz" | tar -xz --strip-components=1 -C "$upstream_dir"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" -c user.name=CI -c user.email=ci@localhost commit --allow-empty --quiet -m "CI source archive"
          node -e "const fs=require('node:fs'); const u=require('./upstream.json'); if(JSON.parse(fs.readFileSync('../deepseek-harness/package.json')).version!==u.sourceVersion) throw Error('Harness sourceVersion mismatch')"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          node scripts/refresh-bundled.mjs --offline
          node scripts/build-dofe-ui.mjs
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'upstream.json') }}
      # The following upstream install validates the sibling's own lockfile.
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm --dir ../deepseek-harness install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Build upstream Harness
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
        run: pnpm upstream:build
      - name: Run macOS package gate
        env:
          CI: 'false'
          DSH_MAC_SMOKE_ARCH: 'arm64'
          npm_config_minimum_release_age: '0'
        run: pnpm --filter dsh-plugin-desktop check:mac-package
      - name: Build macOS smoke artifact
        if: needs.changes.outputs.release != 'true'
        env:
          CI: 'false'
          DSH_MAC_SMOKE_ARCH: 'arm64'
          npm_config_minimum_release_age: '0'
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm --filter dsh-plugin-desktop dist:mac-smoke
      - name: Build signed and notarized macOS release
        if: needs.changes.outputs.release == 'true' && github.event_name != 'pull_request'
        env:
          CI: 'false'
          npm_config_minimum_release_age: '0'
          NODE_OPTIONS: '--max-old-space-size=6144'
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter dsh-plugin-desktop dist:mac
      - name: Preserve macos package size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-size-macos
          path: dsh-plugin-desktop/dist/**/package-size-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: dsh-plugin-desktop/dist/${{ needs.changes.outputs.release == 'true' && 'mac-release' || 'mac-smoke' }}/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Sibling link smoke: the Windows junction materialization plus the
  # portable-shell scripts that must resolve the sibling checkout's own
  # pnpm release. Cheap by design: no workspace install.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Fetch sibling DeepSeek Harness checkout
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          UPSTREAM_REPOSITORY: ${{ needs.changes.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          upstream_dir="$GITHUB_WORKSPACE/../deepseek-harness"
          if command -v cygpath >/dev/null 2>&1; then upstream_dir="$(cygpath -u "$upstream_dir")"; fi
          mkdir -p "$upstream_dir"
          curl --fail --location --retry 3 "https://github.com/$UPSTREAM_REPOSITORY/archive/$UPSTREAM_SHA.tar.gz" | tar -xz --strip-components=1 -C "$upstream_dir"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" -c user.name=CI -c user.email=ci@localhost commit --allow-empty --quiet -m "CI source archive"
          node -e "const fs=require('node:fs'); const u=require('./upstream.json'); if(JSON.parse(fs.readFileSync('../deepseek-harness/package.json')).version!==u.sourceVersion) throw Error('Harness sourceVersion mismatch')"
          node scripts/upstream-workspace-link.mjs
          node scripts/prepare-dofe-ui.mjs
          node scripts/refresh-bundled.mjs --offline
          node scripts/build-dofe-ui.mjs
      - name: Probe the materialized workspace link
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('node:fs').realpathSync('deepseek-harness'); if(!p.endsWith('deepseek-harness')) process.exit(1); console.log('link ->', p)"
      - run: node scripts/verify-layout.mjs
      - run: corepack pnpm --dir ../deepseek-harness --version

  publish-tos:
    needs: [changes, publish-config, check, desktop-windows, desktop-linux, desktop-macos, upstream-command-windows]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Downloading five installers and uploading them across regions can exceed 30 minutes.
    timeout-minutes: 120
    concurrency:
      group: tos-sensteed-agent-${{ needs.changes.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official TOS SDK
        run: python -m pip install -r scripts/ci/tos-requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: desktop-macos
          path: artifacts/macos
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: artifacts/linux
      - name: Publish installers and checksum manifest to TOS
        timeout-minutes: 100
        env:
          TOS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          TOS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_ACCESS_KEY }}
          TOS_BUCKET: ${{ vars.TOS_BUCKET || secrets.TOS_BUCKET || 'dofe-public' }}
          TOS_REGION: ${{ vars.TOS_REGION || secrets.TOS_REGION }}
          TOS_ENDPOINT: ${{ vars.TOS_ENDPOINT || secrets.TOS_ENDPOINT }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL || secrets.TOS_PUBLIC_BASE_URL }}
          DESKTOP_VERSION: ${{ needs.changes.outputs.version }}
          UPSTREAM_SHA: ${{ needs.changes.outputs.upstream_sha }}
          RELEASE: ${{ needs.changes.outputs.release }}
        run: python -B scripts/ci/publish-tos.py --artifacts artifacts
