# Keep the capability bridge at Host scope when the profile patch is reloaded.
- insert:
    - id: desktop-next-capabilities
      name: dsh-desktop-next
# A private, ephemeral loopback port allows Next to coexist with other editions.
- id: webserver
  disabled: true
- insert:
    - id: desktop-next-webserver
      name: dsh-desktop-next/webserver
      inject: [webStartup]
      config:
        host: 127.0.0.1
        port: 0
