<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sensteed · Sidebar design 1019</title>
<style>
:root{color-scheme:dark;--side:#202020;--bg:#181818;--hover:#2a2a2a;--selected:#343434;--text:#ededed;--muted:#ababab;--line:#383838;--focus:#9cbfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.light{color-scheme:light;--side:#f5f5f3;--bg:#fff;--hover:#eaeae7;--selected:#e1e1dd;--text:#222;--muted:#62625e;--line:#d5d5d0;--focus:#3464a4}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}a{color:var(--focus)}.review{height:52px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:0 20px;font-size:12px;color:var(--muted)}.review strong{color:var(--text);letter-spacing:1px}.review .spacer{flex:1}.review button{border:1px solid var(--line);border-radius:7px;padding:5px 10px}.shell{display:flex;height:calc(100dvh - 52px);min-height:480px}.sidebar{width:280px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line);padding:16px 12px 10px}.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;min-height:48px}.mark{filter:brightness(0) invert(1);width:26px;height:26px;object-fit:contain}.light .mark{filter:none}.brand strong{font-size:17px;letter-spacing:-.4px}.icon-button{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;flex-shrink:0}.brand .icon-button{margin-left:auto}.row{width:100%;height:36px;display:flex;align-items:center;gap:10px;text-align:left;padding:0 10px;border-radius:8px;white-space:nowrap}.row svg{color:var(--muted)}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.key{font-size:11px;color:var(--muted)}nav{padding-bottom:16px}.active{background:var(--selected)!important;color:var(--text)}.active svg{color:var(--text)}.tree{flex:1;min-height:100px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.heading{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;padding:14px 10px 6px}.heading button{width:24px;height:24px;border-radius:5px}.project{margin-bottom:8px}.project>.row{height:34px}.chevron{font-size:12px;width:10px;color:var(--muted)}.session{height:32px;padding-left:34px;font-size:13px}.session .dot{color:#93c9ae;font-size:11px;margin-right:2px}.session .running{width:10px;height:10px;border:1.5px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1.2s linear infinite}.footer{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}.account{height:48px;margin-top:6px}.avatar{width:26px;height:26px;border-radius:50%;background:#b8cbb8;color:#263b2a;display:grid;place-items:center;font-size:11px}.account small{display:block;font-size:11px;color:var(--muted)}.account .label{line-height:18px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);gap:10px;color:var(--muted);font-size:13px}.top span:last-child{color:var(--text)}.content{flex:1;overflow:auto;padding:56px clamp(24px,6vw,100px)}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(24px,3vw,36px);font-weight:500;letter-spacing:-1px;margin:12px 0 18px}p{color:var(--muted);max-width:620px;line-height:1.9}.message{margin-top:38px;max-width:680px;border-top:1px solid var(--line);padding-top:24px}.message strong{font-size:15px;font-weight:500}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:680px;margin-top:28px}.card{border:1px solid var(--line);border-radius:12px;padding:20px}.card svg{margin-bottom:12px;color:var(--muted)}.card p{font-size:12px;margin:8px 0 0}.composer{margin:0 clamp(24px,6vw,100px) 20px;border:1px solid var(--line);border-radius:18px;background:var(--side);padding:18px 20px;color:var(--muted)}.composer-bottom{margin-top:26px;display:flex;justify-content:space-between;font-size:12px}.notice{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px}.search{padding:5px 4px}.search input{width:100%;padding:9px;background:var(--bg);border:1px solid var(--line);border-radius:7px}.search button{font-size:12px;padding:6px;color:var(--muted)}.empty,.error{padding:14px 10px;color:var(--muted);font-size:12px}.error{border:1px solid var(--line);border-radius:8px;margin:10px 4px}.error button{color:var(--focus);display:block;margin-top:6px}.collapsed .sidebar{width:56px;padding-inline:6px}.collapsed .wide,.collapsed .brand strong,.collapsed .brand img,.collapsed .tree,.collapsed .account .label{display:none}.collapsed .brand{padding:0 0 14px;justify-content:center}.collapsed .brand .icon-button{margin:0}.collapsed .row{padding:0;justify-content:center}.collapsed .footer{margin-top:auto}.collapsed .account{justify-content:center}.rail-project{display:none}.collapsed .rail-project{display:flex}.hidden{display:none!important}.badge{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 6px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid var(--line);background:var(--selected);border-radius:9px;box-shadow:0 8px 30px #0003;font-size:13px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){.review{padding:0 8px}.review .description{display:none}.content{padding:32px 22px}.cards{grid-template-columns:1fr}.composer{margin-inline:22px}.top{padding:0 20px}.sidebar{width:264px}.review button{padding:5px 7px}}
</style></head><body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="icon-new" viewBox="0 0 24 24"><path d="M12 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6M16 3l5 5M10 14l2-6 5-5 5 5-5 5z"/></symbol>
<symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="icon-plugin" viewBox="0 0 24 24"><path d="M8 3h5v5h5v5h3v8h-8v-3H8v3H3v-8h5V8H3V3z"/></symbol>
<symbol id="icon-skill" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5zM20 2v4M18 4h4"/></symbol>
<symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3z"/></symbol>
<symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 2 3-1 3 1 4-2v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="icon-pin" viewBox="0 0 24 24"><path d="m9 3 12 12-5 1-3 4-4-4-6-1 4-4zM9 16l-6 6"/></symbol>
</defs></svg>
<header class="review"><strong>SIDEBAR / 01</strong><span class="description">产品设计提案 · 2026.10.19</span><span class="spacer"></span><button id="theme">切换浅色</button><button id="failure">模拟失败</button><a href="sidebar-product-spec.md">产品规格 ↗</a></header>
<div class="shell" id="shell"><aside class="sidebar" aria-label="主导航侧栏">
<div class="brand"><img class="mark" src="../../brand/sensteed/assets/sidebar-mark.png" alt=""><strong>Sensteed</strong><button class="icon-button" id="collapse" title="收起侧栏" aria-label="收起侧栏" aria-expanded="true"><svg><use href="#icon-panel"/></svg></button></div>
<nav aria-label="快捷导航"><button class="row" id="new" title="新聊天"><svg><use href="#icon-new"/></svg><span class="label wide">新聊天</span></button><button class="row" id="search" title="搜索聊天"><svg><use href="#icon-search"/></svg><span class="label wide">搜索聊天</span></button><button class="row" data-page="插件" title="插件"><svg><use href="#icon-plugin"/></svg><span class="label wide">插件</span></button><button class="row" data-page="技能" title="技能"><svg><use href="#icon-skill"/></svg><span class="label wide">技能</span></button><button class="row rail-project" id="projects" title="展开项目" aria-label="展开项目"><svg><use href="#icon-folder"/></svg></button></nav>
<div class="tree" id="tree" tabindex="-1" aria-label="项目与聊天"><div class="search hidden" id="searchbox"><label for="query" class="hidden">搜索聊天标题</label><input id="query" aria-label="搜索聊天标题" placeholder="搜索聊天标题…"><button id="clear">清除并关闭</button></div><div id="error" class="error hidden" role="alert">暂时无法同步项目，已保留本地列表。<button id="retry">重试连接</button></div><div id="list"></div></div>
<div class="footer"><button class="row" data-page="设置" title="设置"><svg><use href="#icon-settings"/></svg><span class="label wide">设置</span></button><button class="row account" data-page="账户" title="账户"><span class="avatar">TW</span><span class="label wide">Tech Wu<small>本地示例 · 已连接</small></span><span class="wide">⌄</span></button></div></aside>
<main class="main"><div class="top"><svg><use href="#icon-folder"/></svg><span id="breadcrumb">sensteed-agent</span><span>/</span><span id="crumb">侧栏体验重新设计</span></div><section class="content" id="content" aria-live="polite"></section><div class="composer" aria-hidden="true">继续这个项目的工作…<div class="composer-bottom"><span>＋ &nbsp; 项目上下文</span><span>选择模型 &nbsp; ↑</span></div></div><div class="notice">交互原型 · 示例数据与界面占位，无真实服务调用</div></main></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);const icon=name=>`<svg aria-hidden="true"><use href="#icon-${name}"/></svg>`;
const groups=[{name:'sensteed-agent',open:true,items:[{id:1,title:'侧栏体验重新设计'},{id:2,title:'梳理插件与技能的使用路径',running:true},{id:3,title:'桌面布局与交互细节'}]},{name:'skill.dofe.ai',open:true,items:[{id:4,title:'设计企业技能插件平台',unread:true},{id:5,title:'优化 Bootstrap 页面体验'}]},{name:'datasource.dofe.ai',open:false,items:[{id:6,title:'分析并解决财务测试反馈'}]},{name:'knowledge.dofe.ai',open:false,items:[{id:7,title:'整理团队知识库'}]},{name:'docker-helm.dofe.ai',open:true,items:[{id:8,title:'完善内置能力的交付流程'},{id:9,title:'检查社区插件更新'}]}];let selected=1,nextId=10,searchOpen=false,savedOpen=[],collapsed=false;
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function row(item){const b=document.createElement('button');b.className='row session'+(selected===item.id?' active':'');b.title=item.title;b.setAttribute('aria-label',item.title+(item.running?'，运行中':item.unread?'，有未读更新':''));if(selected===item.id)b.setAttribute('aria-current','page');const label=document.createElement('span');label.className='label';label.textContent=item.title;b.append(label);if(item.running||item.unread){const status=document.createElement('span');status.className=item.running?'running':'dot';status.setAttribute('aria-hidden','true');status.textContent=item.running?'':'●';b.append(status)}b.onclick=()=>{selected=item.id;item.unread=false;clearNav();render();showConversation(item)};return b}
function render(){const list=$('list');list.replaceChildren();const q=$('query').value.trim().toLowerCase();const heading=document.createElement('div');heading.className='heading';heading.textContent=q?'搜索结果':'置顶';list.append(heading);if(!q)list.append(row(groups[0].items[2]));const title=document.createElement('div');title.className='heading';title.textContent='项目';list.append(title);let count=0;groups.forEach((g,i)=>{const items=g.items.filter(x=>x.title.toLowerCase().includes(q));if(q&&!items.length)return;count+=items.length;const section=document.createElement('div');section.className='project';const b=document.createElement('button');b.className='row';b.setAttribute('aria-expanded',String(q?true:g.open));b.innerHTML=`<span class="chevron">${q||g.open?'⌄':'›'}</span>${icon('folder')}<span class="label"></span>`;b.querySelector('.label').textContent=g.name;b.title=g.name;b.onclick=()=>{g.open=!g.open;render();$('list').querySelectorAll('.project>.row')[q?0:i]?.focus()};section.append(b);if(q||g.open)items.forEach(x=>section.append(row(x)));list.append(section)});if(!count){const e=document.createElement('div');e.className='empty';e.textContent='没有匹配的聊天。试试其他关键词，或清除搜索。';list.append(e)}}
function clearNav(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current')})}
function showConversation(item){const g=groups.find(g=>g.items.includes(item));$('breadcrumb').textContent=g.name;$('crumb').textContent=item.title;$('content').innerHTML='<div class="eyebrow">PROJECT WORKSPACE</div><h1></h1><p>把每一次探索，留在清晰的项目上下文里。</p><div class="message"><strong>让工作自然地继续。</strong><p>项目、会话与能力入口各就其位。你可以在左侧切换聊天，或进入插件与技能管理页。</p></div>';$('content').querySelector('h1').textContent=item.title}
function setCollapsed(value){collapsed=value;$('shell').classList.toggle('collapsed',value);$('collapse').title=value?'展开侧栏':'收起侧栏';$('collapse').setAttribute('aria-label',$('collapse').title);$('collapse').setAttribute('aria-expanded',String(!value))}
$('collapse').onclick=()=>setCollapsed(!collapsed);$('projects').onclick=()=>{setCollapsed(false);$('tree').focus()};
$('theme').onclick=()=>{const light=document.body.classList.toggle('light');$('theme').textContent=light?'切换深色':'切换浅色'};
$('search').onclick=()=>{setCollapsed(false);if(!searchOpen){savedOpen=groups.map(g=>g.open);searchOpen=true}$('searchbox').classList.remove('hidden');$('query').focus()};
function closeSearch(){groups.forEach((g,i)=>g.open=savedOpen[i]??g.open);searchOpen=false;$('query').value='';$('searchbox').classList.add('hidden');render();$('search').focus()}
$('clear').onclick=closeSearch;$('query').oninput=render;$('query').onkeydown=e=>{if(e.key==='Escape')closeSearch()};
$('new').onclick=()=>{const item={id:nextId++,title:'新聊天 · '+(nextId-10)};groups[0].items.push(item);groups[0].open=true;selected=item.id;clearNav();render();showConversation(item);toast('已在 sensteed-agent 创建本地示例聊天')};
$('failure').onclick=()=>{setCollapsed(false);$('error').classList.remove('hidden')};$('retry').onclick=()=>{$('error').classList.add('hidden');toast('重试成功（模拟）· 项目列表已恢复')};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{selected=null;clearNav();b.classList.add('active');b.setAttribute('aria-current','page');render();const page=b.dataset.page;$('breadcrumb').textContent='Sensteed';$('crumb').textContent=page;$('content').innerHTML=`<div class="eyebrow">${page==='插件'?'PLUGINS':page==='技能'?'SKILLS':'PREFERENCES'}</div><h1>${page}</h1><p>${page==='插件'?'连接你的工具，让工作流延伸到更多地方。':page==='技能'?'把专业方法沉淀成可重复使用的能力。':'集中管理你的工作偏好与连接。'}</p><div class="cards"><div class="card">${icon(page==='技能'?'skill':'plugin')}<div>已安装${page==='插件'||page==='技能'?page:'配置'}</div><p>管理页内容示意，实际沿用现有管理器。</p></div><div class="card">${icon('search')}<div>发现与管理</div><p>当前仅展示侧栏切换效果，不执行安装或设置操作。</p></div></div>`});
render();showConversation(groups[0].items[0]);if(innerWidth<1024)setCollapsed(true);
</script></body></html>
