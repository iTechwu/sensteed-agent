<script>
const $=id=>document.getElementById(id);const icon=name=>`<svg aria-hidden="true"><use href="#icon-${name}"/></svg>`;
const groups=[{name:'sensteed-agent',open:true,items:[{id:1,title:'侧栏体验重新设计'},{id:2,title:'梳理插件与技能的使用路径',running:true},{id:3,title:'桌面布局与交互细节'}]},{name:'skill.dofe.ai',open:true,items:[{id:4,title:'设计企业技能插件平台',unread:true},{id:5,title:'优化 Bootstrap 页面体验'}]},{name:'datasource.dofe.ai',open:false,items:[{id:6,title:'分析并解决财务测试反馈'}]},{name:'knowledge.dofe.ai',open:false,items:[{id:7,title:'整理团队知识库'}]},{name:'docker-helm.dofe.ai',open:true,items:[{id:8,title:'完善内置能力的交付流程'},{id:9,title:'检查社区插件更新'}]}];let selected=1,nextId=10,searchOpen=false,savedOpen=[],collapsed=false;
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function row(item){const b=document.createElement('button');b.className='row session'+(selected===item.id?' active':'');b.title=item.title;b.setAttribute('aria-label',item.title+(item.running?'，运行中':item.unread?'，有未读更新':''));if(selected===item.id)b.setAttribute('aria-current','page');const label=document.createElement('span');label.className='label';label.textContent=item.title;b.append(label);if(item.running||item.unread){const status=document.createElement('span');status.className=item.running?'running':'dot';status.setAttribute('aria-hidden','true');status.textContent=item.running?'':'●';b.append(status)}b.onclick=()=>{selected=item.id;item.unread=false;clearNav();render();showConversation(item)};return b}
function render(){const list=$('list');list.replaceChildren();const q=$('query').value.trim().toLowerCase();const heading=document.createElement('div');heading.className='heading';heading.textContent=q?'搜索结果':'置顶';list.append(heading);if(!q)list.append(row(groups[0].items[2]));const title=document.createElement('div');title.className='heading';title.textContent='项目';list.append(title);let count=0;groups.forEach((g,i)=>{const items=g.items.filter(x=>x.title.toLowerCase().includes(q));if(q&&!items.length)return;count+=items.length;const section=document.createElement('div');section.className='project';const b=document.createElement('button');b.className='row';b.setAttribute('aria-expanded',String(q?true:g.open));b.innerHTML=`<span class="chevron">${q||g.open?'⌄':'›'}</span>${icon('folder')}<span class="label"></span>`;b.querySelector('.label').textContent=g.name;b.title=g.name;b.onclick=()=>{g.open=!g.open;render();$('list').querySelectorAll('.project>.row')[q?0:i]?.focus()};section.append(b);if(q||g.open)items.forEach(x=>section.append(row(x)));list.append(section)});if(!count){const e=document.createElement('div');e.className='empty';e.textContent='没有匹配的聊天。试试其他关键词，或清除搜索。';list.append(e)}}
function clearNav(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current')})}
function showConversation(item){const g=groups.find(g=>g.items.includes(item));$('breadcrumb').textContent=g.name;$('crumb').textContent=item.title;$('content').innerHTML='<div class="eyebrow">PROJECT WORKSPACE</div><h1></h1><p>把每一次探索，留在清晰的项目上下文里。</p><div class="message"><strong>让工作自然地继续。</strong><p>项目、会话与能力入口各就其位。你可以在左侧切换聊天，或进入插件与技能管理页。</p></div>';$('content').querySelector('h1').textContent=item.title}
function setCollapsed(value){collapsed=value;$('shell').classList.toggle('collapsed',value);for(const id of ['collapse','context-toggle']){const b=$(id);b.title=value?'展开上下文侧栏':'收起上下文侧栏';b.setAttribute('aria-label',b.title);b.setAttribute('aria-expanded',String(!value))}if(value)$('context-toggle').focus()}
$('collapse').onclick=()=>setCollapsed(true);$('context-toggle').onclick=()=>setCollapsed(!collapsed);
$('theme').onclick=()=>{const light=document.body.classList.toggle('light');$('theme').textContent=light?'切换深色':'切换浅色'};
$('search').onclick=()=>{setCollapsed(false);if(!searchOpen){savedOpen=groups.map(g=>g.open);searchOpen=true}$('searchbox').classList.remove('hidden');$('query').focus()};
function closeSearch(){groups.forEach((g,i)=>g.open=savedOpen[i]??g.open);searchOpen=false;$('query').value='';$('searchbox').classList.add('hidden');render();$('search').focus()}
$('clear').onclick=closeSearch;$('query').oninput=render;$('query').onkeydown=e=>{if(e.key==='Escape')closeSearch()};
$('new').onclick=()=>{const item={id:nextId++,title:'新聊天 · '+(nextId-10)};groups[0].items.push(item);groups[0].open=true;selected=item.id;clearNav();render();showConversation(item);toast('已在 sensteed-agent 创建本地示例聊天')};
$('failure').onclick=()=>{setCollapsed(false);$('error').classList.remove('hidden')};$('retry').onclick=()=>{$('error').classList.add('hidden');toast('重试成功（模拟）· 项目列表已恢复')};
const modules=[{id:'home',label:'主页',glyph:'home',sub:'项目与聊天',items:[]},{id:'spaces',label:'空间',glyph:'space',sub:'团队知识与协作',items:['产品设计','供应链协作','团队知识库']},{id:'tasks',label:'定时任务',glyph:'clock',sub:'计划与执行记录',items:['全部任务','运行中','执行记录']},{id:'plugins',label:'插件',glyph:'plugin',sub:'连接工具与业务应用',items:['已安装','发现插件','更新']},{id:'skills',label:'技能',glyph:'skill',sub:'专业方法与工作能力',items:['已安装','发现技能','我的创作']},{id:'supply',label:'供应链管理',glyph:'supply',sub:'企业业务 · 供应链',items:['工作概览','供应商','采购订单','交付跟踪']},{id:'finance',label:'财务管理',glyph:'finance',sub:'企业业务 · 财务',items:['工作概览','应付管理','费用报销','经营报表']}];
const access={admin:['supply','finance'],supply:['supply'],finance:['finance'],member:[]};let currentModule='home';const memory={};
function renderRail(){for(const [target,rows] of [['global-modules',modules.slice(0,5)],['business-modules',modules.filter(m=>access[$('identity').value].includes(m.id))]]){const root=$(target);root.replaceChildren();rows.forEach(m=>{const b=document.createElement('button');b.className='module-button'+(m.id===currentModule?' active':'');b.dataset.module=m.id;b.setAttribute('aria-label',m.label);b.title=m.label;if(m.id===currentModule)b.setAttribute('aria-current','page');b.innerHTML=icon(m.glyph);b.onclick=()=>switchModule(m.id);root.append(b)})}document.querySelector('.rail-caption').textContent=access[$('identity').value].length?'业务':'暂无业务'}
function renderModuleList(m){const root=$('module-list');root.replaceChildren();const heading=document.createElement('div');heading.className='context-list-heading';heading.textContent=m.id==='supply'||m.id==='finance'?'业务导航':'浏览';root.append(heading);m.items.forEach((label,i)=>{const b=document.createElement('button');b.className='row business-row'+(memory[m.id]?.item===label||(!memory[m.id]?.item&&i===0)?' active':'');if(b.classList.contains('active'))b.setAttribute('aria-current','page');b.textContent=label;b.onclick=()=>{memory[m.id]={...memory[m.id],item:label};renderModuleList(m);showModule(m,label)};root.append(b)})}
function showModule(m,label){$('breadcrumb').textContent=m.label;$('crumb').textContent=label;$('content').innerHTML='';const eyebrow=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent=m.id==='supply'||m.id==='finance'?'BUSINESS WORKSPACE':'MODULE WORKSPACE';const h=document.createElement('h1');h.textContent=label;const p=document.createElement('p');p.textContent=m.id==='supply'?'供应商、采购与交付，围绕同一条业务链协作。':m.id==='finance'?'应付、费用与经营数据，在专属工作区集中处理。':m.id==='tasks'?'让重复工作按计划运行，执行进度与历史在这里汇集。':m.id==='spaces'?'为团队知识和长期协作保留共享上下文。':m.id==='plugins'?'管理工具连接与已安装的业务应用。':'管理可重复使用的专业方法与技能。';$('content').append(eyebrow,h,p);const cards=document.createElement('div');cards.className='cards';const samples=m.id==='supply'?[['待跟进供应商','8','供应商管理 · 示例'],['本周待交付','12','交付跟踪 · 示例']]:m.id==='finance'?[['待审核费用','6','费用报销 · 示例'],['本周应付','¥ 128,400','应付管理 · 示例']]:m.id==='tasks'?[['每日供应链简报','每天 09:00','下次运行时间 · 示例'],['每周费用汇总','每周五 17:00','计划任务 · 示例']]:[['当前工作区','已就绪','界面示意，未连接真实服务'],['上下文导航','独立保留','切换模块后恢复上次访问位置']];samples.forEach(([title,value,detail])=>{const c=document.createElement('div');c.className='card';const t=document.createElement('strong');t.textContent=title;const metric=document.createElement('div');metric.className='metric';metric.textContent=value;const d=document.createElement('p');d.textContent=detail;c.append(t,metric,d);cards.append(c)});$('content').append(cards)}
function switchModule(id){memory[currentModule]={...memory[currentModule],scroll:$('tree').scrollTop};currentModule=id;const m=modules.find(m=>m.id===id);renderRail();$('context-title').textContent=m.label;$('context-subtitle').textContent=m.sub;$('chat-actions').classList.toggle('hidden',id!=='home');$('list').classList.toggle('hidden',id!=='home');$('module-list').classList.toggle('hidden',id==='home');$('searchbox').classList.toggle('hidden',id!=='home'||!searchOpen);$('error').classList.add('hidden');document.querySelector('.composer').classList.toggle('hidden',id!=='home');$('context-foot').textContent=id==='home'?'工作上下文保留在当前项目中':'示例导航 · 当前模块独立保留访问位置';if(id==='home'){render();showConversation(groups.flatMap(g=>g.items).find(x=>x.id===selected)||groups[0].items[0])}else{renderModuleList(m);showModule(m,memory[id]?.item||m.items[0])}$('tree').scrollTop=memory[id]?.scroll||0}
$('identity').onchange=()=>{if(['supply','finance'].includes(currentModule)&&!access[$('identity').value].includes(currentModule)){switchModule('home');toast('演示身份已切换：原业务模块不可访问，已返回主页')}else{renderRail();toast('演示身份已切换：业务入口已更新')}};

const settingsSections=[['用户设置','home'],['通用设置','settings'],['模型设置','finance'],['内置能力','skill'],['内置插件','plugin'],['Agent 预设','supply'],['IM 机器人','space'],['桌面','panel'],['桌面设置','panel']];
function showSettings(label){$('settings-nav').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.section===label);if(b.dataset.section===label)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('settings-detail').innerHTML='';const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=label==='用户设置'?'管理登录账号与企业身份。模型和能力可在左侧栏对应页面中设置。':'配置当前'+label+'偏好。此页为设计示意，尚未连接实际设置服务。';$('settings-detail').append(h,p);if(label==='用户设置'){const card=document.createElement('div');card.className='account-card';card.innerHTML='<h4>当前账号</h4><div class="account-person"><span class="avatar">TW</span><strong>Tech Wu</strong><button id="demo-logout">↪ 退出</button></div><dl><dt>企业账号 ID</dt><dd>sensteed-demo-1019</dd><dt>企业授权</dt><dd id="account-role"></dd><dt>选择默认模型</dt><dd>未配置（演示）</dd><dt>内置能力</dt><dd>以实际安装清单为准</dd></dl>';$('settings-detail').append(card);$('account-role').textContent=$('identity').selectedOptions[0].textContent;$('demo-logout').onclick=()=>{const note=$('settings-detail').querySelector('.demo-note');note.textContent='退出仅为设计示意，本原型不会退出真实账号。'}}const note=document.createElement('p');note.className='demo-note';note.textContent='本地交互原型 · 账号、身份及配置均为示例，不执行真实系统操作。';$('settings-detail').append(note)}
settingsSections.forEach(([label,glyph])=>{const b=document.createElement('button');b.className='row';b.dataset.section=label;b.innerHTML=icon(glyph);const span=document.createElement('span');span.className='label';span.textContent=label;b.append(span);b.onclick=()=>showSettings(label);$('settings-nav').append(b)});
$('account-trigger').onclick=()=>{hideTooltip();showSettings('用户设置');$('settings-dialog').append($('icon-tooltip'));$('settings-dialog').showModal();$('settings-close').focus()};
$('settings-dialog').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...$('settings-dialog').querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex="0"]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
$('settings-close').onclick=()=>$('settings-dialog').close();$('settings-dialog').addEventListener('click',e=>{if(e.target===$('settings-dialog')){const r=$('settings-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('settings-dialog').close()}});$('settings-dialog').addEventListener('close',()=>{hideTooltip();document.body.append($('icon-tooltip'));$('account-trigger').focus()});
let tooltipTimer,tooltipTarget;
function hideTooltip(){clearTimeout(tooltipTimer);$('icon-tooltip').classList.add('hidden');if(tooltipTarget){tooltipTarget.removeAttribute('aria-describedby');tooltipTarget=null}}
function prepareTooltip(target){hideTooltip();const label=target.getAttribute('aria-label')||target.title;if(!label)return;tooltipTimer=setTimeout(()=>{if(!target.isConnected)return;tooltipTarget=target;const t=$('icon-tooltip');t.textContent=label;t.classList.remove('hidden');target.setAttribute('aria-describedby','icon-tooltip');const r=target.getBoundingClientRect(),box=t.getBoundingClientRect();let left=r.right+10,top=r.top+(r.height-box.height)/2;if(left+box.width>innerWidth-8)left=r.left-box.width-10;t.style.left=Math.max(8,left)+'px';t.style.top=Math.max(8,Math.min(top,innerHeight-box.height-8))+'px'},250)}
const tooltipSelector='.module-button,.icon-button,#new,#search';document.addEventListener('pointerover',e=>{const target=e.target.closest(tooltipSelector);if(target&&!target.contains(e.relatedTarget))prepareTooltip(target)});document.addEventListener('pointerout',e=>{const target=e.target.closest(tooltipSelector);if(target&&!target.contains(e.relatedTarget))hideTooltip()});document.addEventListener('focusin',e=>{if(e.target.matches(tooltipSelector))prepareTooltip(e.target)});document.addEventListener('focusout',hideTooltip);document.addEventListener('pointerdown',hideTooltip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTooltip()});document.addEventListener('scroll',hideTooltip,true);
switchModule('home');if(innerWidth<1024)setCollapsed(true);
</script></body></html>
