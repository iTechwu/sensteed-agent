packages:
  - dsh-sensteed-product
  - dsh-plugin-desktop
  - dsh-community-fabric
  - dsh-community-market
  - dsh-desktop-next
  - deepseek-harness/apps/**
  - deepseek-harness/packages/**
  - deepseek-harness/native/**
  - deepseek-harness/plugins/dsh-openmontage-mcp
  - deepseek-harness/vendor/**

allowBuilds:
  '@dataiku/uv': false
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  cloudflared: true
  cpu-features: true
  electron: true
  electron-winstaller: false
  esbuild: true
  fs-ext: true
  koffi: true
  lefthook: true
  node-addon-require-builtin: false
  node-pty: true
  protobufjs: false
  ssh2: true

linkWorkspacePackages: true

# CI 的 Windows runner 以 junction 承载 deepseek-harness,pnpm 11 默认的
# run 前依赖校验会把 junction 展开出的 fork importer 误判为 lockfile 漂移,
# 触发自动 frozen install 并以 OUTDATED_LOCKFILE 失败。各 job 均已显式
# install,这里关闭 run 前自动校验。
verifyDepsBeforeRun: false

overrides:
  app-builder-lib>@electron/get: 5.1.0

supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - x64
    - arm64

patchedDependencies:
  app-builder-lib@26.17.0: patches/app-builder-lib@26.17.0.patch
  dshmarket@1.39.0: patches/dshmarket@1.39.0.patch
  open@11.0.1: patches/open@11.0.1.patch

# 0.2.0 迁移期:AA 桥接等最新发布包要即刻可用,发布年龄门整体关闭;
# 锁文件仍受解析期排除表与 tarball 一致性校验约束。
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - dshmarket@1.39.0
  - '@agents-anywhere/dsh-bridge-next@2.0.1'
  - '@agents-anywhere/dsh-bridge-next@2.0.2'
